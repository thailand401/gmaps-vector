<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GMaps Vector</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Segoe UI', Arial, sans-serif; }

    #map { position: fixed; inset: 0; z-index: 0; }

    /* ── Toolbar ── */
    #toolbar {
      position: fixed;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 8px; align-items: center;
      background: #fff;
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      z-index: 10;
      flex-wrap: wrap;
      max-width: calc(100vw - 24px);
    }
    #toolbar select, #toolbar input[type=text] {
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      background: #fafafa;
      outline: none;
      cursor: pointer;
      min-width: 130px;
    }
    #toolbar select:focus, #toolbar input[type=text]:focus {
      border-color: #4285f4;
      background: #fff;
    }
    #searchInput {
      min-width: 180px;
    }
    #toolbar button {
      border: none;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      background: #4285f4;
      color: #fff;
      font-weight: 600;
      transition: background .15s;
    }
    #toolbar button:hover { background: #2a6dd4; }
    #toolbar button.secondary {
      background: #f1f3f4; color: #3c4043;
    }
    #toolbar button.secondary:hover { background: #e2e4e6; }
    #toolbar button.active {
      background: #34a853; color: #fff;
    }
    #toolbar button.active:hover { background: #2d9248; }

    /* ── Counter badge ── */
    #counter {
      position: fixed;
      bottom: 24px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.65);
      color: #fff;
      border-radius: 20px;
      padding: 4px 16px;
      font-size: 13px;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── Info panel (marker click) ── */
    #infoPanel {
      position: fixed;
      bottom: 60px; right: 16px;
      width: 280px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.25);
      padding: 16px;
      z-index: 10;
      display: none;
      font-size: 13px;
      line-height: 1.6;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
    }
    #infoPanel h3 {
      font-size: 14px;
      margin-bottom: 8px;
      color: #202124;
    }
    #infoPanel .row { display: flex; justify-content: space-between; }
    #infoPanel .label { color: #777; }
    #infoPanel .close-btn {
      position: absolute; top: 10px; right: 12px;
      cursor: pointer; font-size: 18px; color: #888; line-height: 1;
      background: none; border: none;
    }
    #infoPanel .close-btn:hover { color: #333; }

    /* ── Loading overlay ── */
    #loading {
      position: fixed; inset: 0;
      background: rgba(255,255,255,.7);
      display: flex; align-items: center; justify-content: center;
      z-index: 20;
      font-size: 16px; color: #555;
    }
    #loading.hidden { display: none; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 70px; left: 50%;
      transform: translateX(-50%);
      background: rgba(52,168,83,.95);
      color: #fff;
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 13px;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
      white-space: nowrap;
      max-width: calc(100vw - 32px);
      text-align: center;
    }
    #toast.show { opacity: 1; }

    /* ── Add-point modal (panel bên trái, không chặn map) ── */
    #addModal, #setNodeModal {
      position: fixed;
      top: 70px; left: 16px;
      width: 300px;
      max-height: calc(100vh - 90px);
      overflow-y: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,.25);
      padding: 16px;
      z-index: 15;
      display: none;
      font-size: 13px;
    }
    #addModal h3, #setNodeModal h3 { font-size: 14px; margin-bottom: 12px; color: #202124; }
    #addModal .close-btn, #setNodeModal .close-btn {
      position: absolute; top: 10px; right: 12px;
      cursor: pointer; font-size: 18px; color: #888; line-height: 1;
      background: none; border: none;
    }
    #addModal .close-btn:hover, #setNodeModal .close-btn:hover { color: #333; }
    .modal-field { margin-bottom: 12px; }
    .modal-field > label {
      display: block; color: #777; margin-bottom: 4px; font-size: 12px;
    }
    .latlng-label {
      font-family: monospace; background: #f1f3f4;
      border-radius: 6px; padding: 6px 8px;
    }
    .row-inline { display: flex; gap: 6px; align-items: center; }
    .row-inline select { flex: 1; min-width: 0; }
    #addModal select, #setNodeModal select {
      border: 1px solid #d0d0d0; border-radius: 8px;
      padding: 6px 8px; font-size: 13px; background: #fafafa; outline: none;
    }
    #addModal .icon-btn, #setNodeModal .icon-btn {
      border: none; border-radius: 8px; padding: 6px 11px;
      font-size: 15px; line-height: 1; cursor: pointer;
      background: #34a853; color: #fff; font-weight: 700; flex: 0 0 auto;
    }
    #addModal .icon-btn:hover, #setNodeModal .icon-btn:hover { background: #2d9248; }
    .modal-hint { display: block; color: #999; font-size: 11px; margin-top: 4px; }
    .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
    #addModal .modal-actions button, #setNodeModal .modal-actions button {
      border: none; border-radius: 8px; padding: 8px 14px;
      font-size: 13px; cursor: pointer; font-weight: 600; flex: 1;
    }
    #btnSubmitPoint, #btnSetNodeSave { background: #4285f4; color: #fff; }
    #btnSubmitPoint:hover, #btnSetNodeSave:hover { background: #2a6dd4; }
    #btnSubmitPoint:disabled, #btnSetNodeSave:disabled { background: #b9c6e0; cursor: not-allowed; }
    #btnCancelPoint, #btnSetNodeCancel { background: #f1f3f4; color: #3c4043; }
    #btnCancelPoint:hover, #btnSetNodeCancel:hover { background: #e2e4e6; }
    #infoPanel .info-action {
      margin-top: 12px; width: 100%;
      border: none; border-radius: 8px; padding: 8px;
      background: #34a853; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    #infoPanel .info-action:hover { background: #2d9248; }
    .nearby-box {
      max-height: 140px; overflow-y: auto;
      border: 1px solid #e0e0e0; border-radius: 8px;
      padding: 6px 8px; background: #fafafa;
    }
    .nearby-box label {
      display: flex; align-items: center; gap: 6px;
      padding: 2px 0; font-size: 12px; color: #3c4043; cursor: pointer;
    }
    .nearby-box .empty { color: #999; font-size: 12px; padding: 2px 0; }
    .node-street-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 3px 2px; font-size: 12px; color: #3c4043;
    }
    .node-street-row button {
      border: none; background: none; color: #d33; cursor: pointer;
      font-size: 15px; line-height: 1;
    }
    #nearbyCount { color: #34a853; font-weight: 600; }
  </style>
</head>
<body>

<!-- Map canvas -->
<div id="map"></div>

<!-- Loading overlay -->
<div id="loading">Đang tải bản đồ…</div>

<!-- Toolbar -->
<div id="toolbar">
  <input type="text" id="searchInput" placeholder="🔍 Tìm địa điểm…" />
  <button id="btnSearch" class="secondary">Tìm</button>
  <select id="selCity"><option value="">-- Thành phố --</option></select>
  <select id="selDistrict"><option value="">-- Quận/Huyện --</option></select>
  <select id="selStreet"><option value="">-- Đường --</option></select>
  <button id="btnLoad">Lọc điểm</button>
  <button id="btnMove" class="secondary">Move điểm</button>
  <button id="btnAdd" class="secondary">Add điểm</button>
  <button id="btnClear" class="secondary">Reset</button>
</div>

<!-- Marker count -->
<div id="counter" style="display:none"></div>

<!-- Toast -->
<div id="toast"></div>

<!-- Info panel -->
<div id="infoPanel">
  <button class="close-btn" id="closeInfo">&times;</button>
  <h3 id="infoTitle">Chi tiết điểm</h3>
  <div id="infoBody"></div>
  <button id="btnSetNode" class="info-action">Set Node (sửa đường)</button>
</div>

<!-- Set Node modal -->
<div id="setNodeModal">
  <button class="close-btn" id="setNodeCloseX">&times;</button>
  <h3>Set Node — đường của điểm</h3>

  <div class="modal-field">
    <label>Điểm</label>
    <div id="setNodeInfo" class="latlng-label">—</div>
  </div>

  <div class="modal-field">
    <label>Đường lân cận ≤ 1km <span id="setNodeNearbyCount"></span></label>
    <div class="row-inline">
      <select id="setNodeNearbySel" multiple size="4"></select>
      <button id="btnSetNodeAdd" class="icon-btn" title="Thêm các đường đã chọn vào node">+</button>
    </div>
  </div>

  <div class="modal-field">
    <label>Đường của node</label>
    <div id="setNodeStreetsList" class="nearby-box"></div>
  </div>

  <div class="modal-actions">
    <button id="btnSetNodeSave">Lưu</button>
    <button id="btnSetNodeCancel">Huỷ</button>
  </div>
</div>

<!-- Add-point modal -->
<div id="addModal">
  <button class="close-btn" id="btnCancelPointX">&times;</button>
  <h3>Thêm điểm mới</h3>

  <div class="modal-field">
    <label>Toạ độ (lat / lng)</label>
    <div id="addLatLng" class="latlng-label">—</div>
  </div>

  <div class="modal-field">
    <label>Phường (district)</label>
    <div class="row-inline">
      <select id="addDistrictSel"><option value="">-- Chọn phường --</option></select>
      <button id="btnCreateDistrict" class="icon-btn" title="Tạo phường từ OSM">+</button>
    </div>
    <small id="addDistrictOsm" class="modal-hint"></small>
  </div>

  <div class="modal-field">
    <label>Đường (street) *</label>
    <div class="row-inline">
      <select id="addStreetSel"><option value="">-- Chọn đường --</option></select>
      <button id="btnCreateStreet" class="icon-btn" title="Tạo đường từ OSM">+</button>
    </div>
    <small id="addStreetOsm" class="modal-hint"></small>
  </div>

  <div class="modal-field">
    <label>Đường lân cận ≤ 1km <span id="nearbyCount"></span></label>
    <div class="row-inline">
      <select id="nearbyStreetSel" multiple size="4"></select>
      <button id="btnAddNearby" class="icon-btn" title="Thêm các đường đã chọn vào node">+</button>
    </div>
    <div id="nodeStreetsList" class="nearby-box"></div>
  </div>

  <div class="modal-actions">
    <button id="btnSubmitPoint" disabled>Tạo điểm</button>
    <button id="btnCancelPoint">Huỷ</button>
  </div>
</div>

<!-- Leaflet JS -->
<script src="js/auth.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ══════════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════════
const API          = location.hostname === 'localhost' ? 'http://localhost:4000/api' : '/api';
const DEFAULT_LAT  = 10.8231;
const DEFAULT_LNG  = 106.6297;
const DEFAULT_ZOOM = 12;
const NEARBY_RADIUS_KM = 1; // bán kính gộp đường lân cận vào 1 node (Add điểm)
const LAST_MARKER_KEY = 'gmaps_last_marker'; // localStorage: toạ độ marker chọn gần nhất

// ══════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════
let map;
let layerGroup  = null;   // L.LayerGroup chứa toàn bộ marker
let pathLayer   = null;   // L.LayerGroup chứa polyline path của street
let streetMap   = {};     // id → street object
let districtMap = {};     // id → district object
let allStreets  = [];
let moveMode      = false; // bật/tắt chế độ kéo-thả marker
let activeInfoPos = null;  // pos đang hiển thị ở info panel
let addMode       = false; // bật/tắt chế độ thêm điểm (click map)
let pendingMarker = null;  // marker tạm cho điểm đang thêm
let pendingGeo    = null;  // { lat, lng, osmStreet, osmWard }

// ══════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════
async function apiFetch(path) {
  const res = await fetch(API + path, { headers: { 'X-API-Key': sessionStorage.getItem('admin_api_key') || '' } });
  if (!res.ok) throw new Error(`API ${path} → ${res.status}`);
  return res.json();
}

async function apiSend(path, method, body) {
  const res = await fetch(API + path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'X-API-Key': sessionStorage.getItem('admin_api_key') || '',
    },
    body: body != null ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(`API ${path} → ${res.status}`);
  return res.json();
}

let _toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// Lưu toạ độ marker vừa chọn để lần reload sau center về đó (zoom 15)
function saveLastMarker(pos) {
  try { localStorage.setItem(LAST_MARKER_KEY, JSON.stringify({ lat: pos.y, lng: pos.x })); } catch (e) {}
}

function setLoading(on) {
  document.getElementById('loading').classList.toggle('hidden', !on);
}

function setCounter(n) {
  const el = document.getElementById('counter');
  if (n === 0) { el.style.display = 'none'; return; }
  el.style.display = 'block';
  el.textContent = `${n} điểm`;
}

function hideInfo() {
  document.getElementById('infoPanel').style.display = 'none';
  activeInfoPos = null;
}

// ══════════════════════════════════════════════════
//  LEAFLET MAP INIT
// ══════════════════════════════════════════════════
function initMap() {
  map = L.map('map', { zoomControl: true }).setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);

  layerGroup = L.layerGroup().addTo(map);
  pathLayer  = L.layerGroup().addTo(map);

  // Click map khi đang ở chế độ "Add điểm" → bắt đầu thêm điểm
  map.on('click', e => {
    if (!addMode) return;
    startAddPoint(e.latlng.lat, e.latlng.lng);
  });
}

// ══════════════════════════════════════════════════
//  CUSTOM CIRCLE ICON
// ══════════════════════════════════════════════════
function circleIcon(color) {
  color = color || '#4285f4';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14">
    <circle cx="7" cy="7" r="6" fill="${color}" stroke="#fff" stroke-width="1.5"/>
  </svg>`;
  return L.divIcon({
    html: svg,
    className: '',
    iconSize: [14, 14],
    iconAnchor: [7, 7],
  });
}

// ══════════════════════════════════════════════════
//  MARKERS
// ══════════════════════════════════════════════════
function clearMarkers() {
  if (layerGroup) layerGroup.clearLayers();
  clearPaths();
  setCounter(0);
  hideInfo();
}

function createMarker(pos) {
  // pos: { id, x:lon, y:lat, streets:[], speed, ban, ... }
  const lat = pos.y, lng = pos.x;
  if (lat == null || lng == null) return null;

  const streetNames = (pos.streets || [])
    .map(id => streetMap[id]?.name)
    .filter(Boolean)
    .join(', ') || '—';

  const m = L.marker([lat, lng], { icon: circleIcon('#4285f4'), title: streetNames, draggable: moveMode });
  m._pos = pos;
  m._streetNames = streetNames;
  m.on('click', () => showInfo(pos, streetNames, m));
  m.on('dragend', () => onMarkerDragEnd(m));
  return m;
}

// ── Drag-drop: cập nhật lat/lng mới khi thả marker ──
async function onMarkerDragEnd(marker) {
  const pos = marker._pos;
  const prevLat = pos.y, prevLng = pos.x;
  const ll = marker.getLatLng();
  // Làm tròn 6 chữ số thập phân
  const newLat = Math.round(ll.lat * 1e6) / 1e6;
  const newLng = Math.round(ll.lng * 1e6) / 1e6;

  // Snap marker về vị trí đã làm tròn + cập nhật dữ liệu
  marker.setLatLng([newLat, newLng]);
  pos.y = newLat;
  pos.x = newLng;
  pos._geo = null; // toạ độ đổi → xoá cache geocode để lấy lại
  pos._road = null;
  if (activeInfoPos === pos) showInfo(pos, marker._streetNames, marker);

  try {
    await apiSend(`/positions/${pos.id}`, 'PUT', { x: newLng, y: newLat });
    showToast(`Đã lưu #${pos.id}: ${newLat}, ${newLng}`);
  } catch (e) {
    console.error('onMarkerDragEnd', e);
    // Revert khi lưu thất bại
    pos.y = prevLat; pos.x = prevLng;
    marker.setLatLng([prevLat, prevLng]);
    if (activeInfoPos === pos) showInfo(pos, marker._streetNames, marker);
    alert('Không thể lưu vị trí mới cho điểm #' + pos.id);
  }
}

// ── Bật/tắt chế độ di chuyển điểm ──
function setMoveMode(on) {
  moveMode = on;
  if (on) { setAddMode(false); closeAddModal(); closeSetNode(); } // không bật đồng thời với "Add điểm"
  const btn = document.getElementById('btnMove');
  btn.classList.toggle('active', on);
  btn.classList.toggle('secondary', !on);
  if (layerGroup) {
    layerGroup.eachLayer(layer => {
      if (!layer.dragging) return;
      if (on) layer.dragging.enable();
      else layer.dragging.disable();
    });
  }
  showToast(on ? 'Chế độ di chuyển: BẬT — kéo marker để đổi vị trí' : 'Chế độ di chuyển: TẮT');
}

// ══════════════════════════════════════════════════
//  STREET PATH (vẽ path nối các điểm của street)
// ══════════════════════════════════════════════════
const PATH_COLORS = ['#2196F3','#E91E63','#4CAF50','#FF9800','#9C27B0','#00BCD4','#FF5722','#8BC34A','#F44336','#3F51B5'];

function clearPaths() {
  if (pathLayer) pathLayer.clearLayers();
}

// Khoảng cách bình phương (xấp xỉ) để so sánh tương đối
function _geoDist2(a, b) {
  const dLat = a.lat - b.lat;
  const dLon = a.lng - b.lng;
  const cosLat = Math.cos(a.lat * Math.PI / 180);
  return dLat * dLat + dLon * dLon * cosLat * cosLat;
}

// Sắp xếp điểm dọc theo đường: bắt đầu từ 1 đầu (2 điểm xa nhau nhất) rồi nối nearest-neighbor
function nearestNeighborSort(pts) {
  if (pts.length <= 1) return [...pts];
  let maxD = -1, startIdx = 0;
  for (let i = 0; i < pts.length; i++)
    for (let j = i + 1; j < pts.length; j++) {
      const d = _geoDist2(pts[i], pts[j]);
      if (d > maxD) { maxD = d; startIdx = i; }
    }
  const rem = [...pts], result = [];
  let cur = rem.splice(startIdx, 1)[0];
  result.push(cur);
  while (rem.length) {
    let minD = Infinity, minI = 0;
    for (let i = 0; i < rem.length; i++) {
      const d = _geoDist2(rem[i], cur);
      if (d < minD) { minD = d; minI = i; }
    }
    cur = rem.splice(minI, 1)[0];
    result.push(cur);
  }
  return result;
}

// Lấy các điểm (đã load) thuộc 1 street
function collectStreetPoints(streetId) {
  const pts = [];
  if (layerGroup) layerGroup.eachLayer(l => {
    const p = l._pos;
    if (p && Array.isArray(p.streets) && p.streets.includes(streetId) && p.y != null && p.x != null) {
      pts.push({ lat: p.y, lng: p.x });
    }
  });
  return pts;
}

// Vẽ polyline cho 1 street; trả về true nếu vẽ được (≥2 điểm)
function drawStreetPath(streetId, color) {
  const pts = collectStreetPoints(streetId);
  if (pts.length < 2) return false;
  const sorted = nearestNeighborSort(pts);
  L.polyline(sorted.map(p => [p.lat, p.lng]), {
    color: color || '#E91E63', weight: 3, opacity: 0.85, dashArray: '6,4',
  }).addTo(pathLayer);
  return true;
}

// Vẽ path cho tất cả street thuộc 1 phường (mỗi đường 1 màu)
function drawDistrictPaths(districtId) {
  let colorIdx = 0;
  Object.values(streetMap).forEach(s => {
    if (s && Number(s.district_id) === districtId) {
      if (drawStreetPath(s.id, PATH_COLORS[colorIdx % PATH_COLORS.length])) colorIdx++;
    }
  });
}

// Cập nhật path theo toolbar: chọn street → vẽ street đó; chỉ chọn phường → vẽ mọi street của phường
function updatePaths() {
  clearPaths();
  const streetId = parseInt(document.getElementById('selStreet').value);
  const districtId = parseInt(document.getElementById('selDistrict').value);
  if (streetId) drawStreetPath(streetId, '#E91E63');
  else if (districtId) drawDistrictPaths(districtId);
}

// ══════════════════════════════════════════════════
//  LOAD ALL POSITIONS FROM DB
// ══════════════════════════════════════════════════
async function loadPositions(endpoint) {
  endpoint = endpoint || '/positions';
  clearMarkers();
  setLoading(true);
  try {
    const positions = await apiFetch(endpoint);
    if (!Array.isArray(positions) || positions.length === 0) {
      setCounter(0);
      setLoading(false);
      return;
    }

    const bounds = L.latLngBounds();
    let valid = 0;
    let firstLatLng = null;

    positions.forEach(pos => {
      const m = createMarker(pos);
      if (!m) return;
      m.addTo(layerGroup);
      bounds.extend(m.getLatLng());
      if (!firstLatLng) firstLatLng = m.getLatLng();
      valid++;
    });

    setCounter(valid);

    // Tâm theo marker đầu tiên, sau đó fit bounds nếu có nhiều điểm
    if (firstLatLng) {
      if (valid === 1) {
        map.setView(firstLatLng, 15);
      } else {
        map.fitBounds(bounds, { padding: [40, 40] });
      }
    }
  } catch (e) {
    console.error('loadPositions', e);
    alert('Không thể tải dữ liệu vị trí.\nKiểm tra server tại ' + API);
  } finally {
    setLoading(false);
    updatePaths();
  }
}

// ── Reverse geocoding qua Nominatim: lat/lon → street, ward (phường) ──
async function reverseGeocode(lat, lon) {
  const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}`
            + `&format=json&addressdetails=1&accept-language=vi`;
  const res = await fetch(url, { headers: { 'Accept-Language': 'vi' } });
  if (!res.ok) throw new Error(`Nominatim → ${res.status}`);
  const data = await res.json();
  const a = data.address || {};
  const street = a.road || a.pedestrian || a.residential || a.footway || a.path || a.neighbourhood || '';
  const ward   = a.quarter || a.suburb || a.ward || a.neighbourhood || a.city_district || a.district || a.county || '';
  return { street, ward };
}

// Điền street/phường (OSM) vào info panel (cache theo pos để tránh gọi lại Nominatim)
async function fillReverseGeocode(pos) {
  const apply = (street, ward) => {
    if (activeInfoPos !== pos) return; // marker khác đã được chọn
    const sEl = document.getElementById('infoOsmStreet');
    const wEl = document.getElementById('infoOsmWard');
    if (sEl) sEl.textContent = street || '—';
    if (wEl) wEl.textContent = ward   || '—';
  };

  if (pos._geo) { apply(pos._geo.street, pos._geo.ward); return; }

  try {
    const geo = await reverseGeocode(pos.y, pos.x);
    pos._geo = geo;
    apply(geo.street, geo.ward);
  } catch (e) {
    console.error('reverseGeocode', e);
    apply('', '');
  }
}

// ══════════════════════════════════════════════════
//  ROAD INFO (Overpass: 1 chiều, cấm tải, cao tốc…)
// ══════════════════════════════════════════════════
const OVERPASS_URL = 'https://overpass-api.de/api/interpreter';

// Khoảng cách điểm → đoạn thẳng (mét), xấp xỉ phẳng (đủ cho cự ly ngắn)
function distPointToSegM(plat, plon, alat, alon, blat, blon) {
  const mLat = 111320, mLon = 111320 * Math.cos(plat * Math.PI / 180);
  const px = plon * mLon, py = plat * mLat;
  const ax = alon * mLon, ay = alat * mLat;
  const bx = blon * mLon, by = blat * mLat;
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  let t = len2 ? ((px - ax) * dx + (py - ay) * dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

// Tìm way [highway] gần (lat,lon) nhất trong bán kính radius (m) qua Overpass
async function roadInfoAt(lat, lon, radius = 30) {
  const ql = `[out:json][timeout:25];way(around:${radius},${lat},${lon})[highway];out tags geom;`;
  const res = await fetch(OVERPASS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'data=' + encodeURIComponent(ql),
  });
  if (!res.ok) throw new Error(`Overpass → ${res.status}`);
  const data = await res.json();
  let best = null, bestD = Infinity;
  for (const w of (data.elements || [])) {
    if (w.type !== 'way' || !Array.isArray(w.geometry)) continue;
    let d = Infinity;
    for (let i = 0; i + 1 < w.geometry.length; i++) {
      const dd = distPointToSegM(lat, lon, w.geometry[i].lat, w.geometry[i].lon, w.geometry[i+1].lat, w.geometry[i+1].lon);
      if (dd < d) d = dd;
    }
    if (d < bestD) { bestD = d; best = w; }
  }
  return best ? { tags: best.tags || {}, dist: bestD } : null;
}

// Diễn giải tag OSM → tiếng Việt
function formatRoadInfo(tags) {
  const HW = {
    motorway: 'Cao tốc', motorway_link: 'Nhánh cao tốc',
    trunk: 'Trục chính/QL', trunk_link: 'Nhánh trục chính',
    primary: 'Đường chính', secondary: 'Đường thứ cấp', tertiary: 'Đường nhánh',
    residential: 'Khu dân cư', service: 'Đường nội bộ', living_street: 'Đường nội khu',
    unclassified: 'Chưa phân loại', pedestrian: 'Đi bộ', footway: 'Lối đi bộ', cycleway: 'Đường xe đạp',
  };
  const hw = tags.highway || '';
  const loai = HW[hw] || hw || '—';

  let oneway;
  const ow = tags.oneway;
  if (['yes', 'true', '1'].includes(ow)) oneway = '1 chiều';
  else if (['-1', 'reverse'].includes(ow)) oneway = '1 chiều (ngược hướng vẽ)';
  else if (ow === 'no' || ow === 'false') oneway = '2 chiều';
  else if (hw === 'motorway' || hw === 'motorway_link') oneway = '1 chiều (mặc định cao tốc)';
  else oneway = ow ? ow : '2 chiều / chưa rõ';

  const restr = [];
  if (['no', 'destination'].includes(tags.hgv)) restr.push('hạn chế xe tải');
  if (['no', 'private'].includes(tags.access)) restr.push('hạn chế lưu thông');
  if (tags.motor_vehicle === 'no') restr.push('cấm xe cơ giới');
  if (tags.maxweight) restr.push('tải ≤ ' + tags.maxweight + 't');
  if (tags.maxheight) restr.push('cao ≤ ' + tags.maxheight + 'm');
  const camTai = restr.length ? restr.join(', ') : '—';

  return { loai, oneway, camTai };
}

// Điền thuộc tính đường vào info panel (cache theo pos._road)
async function fillRoadInfo(pos) {
  const apply = (info) => {
    if (activeInfoPos !== pos) return;
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
    set('infoRoadType',     info ? info.loai   : '—');
    set('infoRoadOneway',   info ? info.oneway : '—');
    set('infoRoadRestrict', info ? info.camTai : '—');
  };
  if (pos._road) { apply(pos._road); return; }
  try {
    const r = await roadInfoAt(pos.y, pos.x, 30);
    pos._road = r ? formatRoadInfo(r.tags) : { loai: '—', oneway: '—', camTai: '—' };
    apply(pos._road);
  } catch (e) {
    console.error('roadInfoAt', e);
    apply(null);
  }
}

  document.getElementById('addStreetOsm').textContent = 'OSM: đang tải…';
  resetSelect('addDistrictSel', '-- Chọn phường --');
  resetSelect('addStreetSel', '-- Chọn đường --');
  clearNodeStreets();
  updateSubmitState();
  document.getElementById('addModal').style.display = 'block';
  map.panTo([rlat, rlng]);

  // Đổ đường lân cận ≤1km vào dropdown (tham khảo "Set Node" bên maps.html)
  fillNearbyStreets(rlat, rlng);

  // 1) Reverse geocode → tên đường + phường OSM
  let geo = { street: '', ward: '' };
  try { geo = await reverseGeocode(rlat, rlng); }
  catch (e) { console.error('reverseGeocode(add)', e); }
  if (!pendingGeo) return; // đã huỷ trong lúc chờ
  pendingGeo.osmStreet = geo.street || '';
  pendingGeo.osmWard   = geo.ward   || '';
  document.getElementById('addStreetOsm').textContent   = 'OSM: ' + (geo.street || '(không có)');
  document.getElementById('addDistrictOsm').textContent = 'OSM: ' + (geo.ward   || '(không có)');

  // 2) Fuzzy search song song street + district (dữ liệu cục bộ, city_id=1)
  const [streetRes, districtRes] = await Promise.all([
    geo.street ? apiSend('/streets/search',   'POST', { text: geo.street, city_id: 1, limit: 10 }).catch(() => ({ results: [] })) : Promise.resolve({ results: [] }),
    geo.ward   ? apiSend('/districts/search', 'POST', { text: geo.ward,   city_id: 1, limit: 10 }).catch(() => ({ results: [] })) : Promise.resolve({ results: [] }),
  ]);
  if (!pendingGeo) return;
  fillDistrictOptions(districtRes.results || []);
  fillStreetOptions(streetRes.results || []);
  updateSubmitState();
}

// Haversine (km)
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// Đường có ít nhất 1 điểm (marker đã load) nằm trong bán kính radiusKm quanh (lat,lng)
function getNearbyStreets(lat, lng, radiusKm) {
  const sids = new Set();
  if (layerGroup) {
    layerGroup.eachLayer(layer => {
      const p = layer._pos;
      if (!p || p.y == null || p.x == null) return;
      if (haversineKm(lat, lng, p.y, p.x) <= radiusKm) {
        (p.streets || []).forEach(sid => sids.add(sid));
      }
    });
  }
  return [...sids]
    .map(sid => (streetMap[sid] ? { id: sid, name: streetMap[sid].name || ('#' + sid) } : null))
    .filter(Boolean)
    .sort((a, b) => String(a.name).localeCompare(String(b.name)));
}

}

// POST /api/streets có thể trả 409 (trùng) → dùng lại street đang có
async function createStreetAjax(payload) {
  const res = await fetch(API + '/streets', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Key': sessionStorage.getItem('admin_api_key') || '' },
    body: JSON.stringify(payload),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 409 && data.street) {
    return { id: data.street.id, name: data.street.name, duplicate: true };
  }
  if (!res.ok) throw new Error(data.detail || `streets → ${res.status}`);
  return data; // { id, name, ... }
}

    const resp = await apiSend('/positions/bulk', 'POST', [{ lat, lon: lng, streets }]);
    const row = (resp.created || [])[0];
    if (!row) throw new Error('Không nhận được dữ liệu điểm');
    const pos = { id: row.id, x: row.long != null ? row.long : lng, y: row.lat != null ? row.lat : lat, streets: row.streets || streets };
    const m = createMarker(pos);
    if (m) m.addTo(layerGroup);
    closeAddModal();
    showToast(`Đã tạo điểm #${pos.id}`);
  } catch (e) {
    console.error('createPosition', e);
    alert('Tạo điểm thất bại.');
    btn.disabled = false;
  }
}

function updateSubmitState() {
  const has = !!document.getElementById('addStreetSel').value;
  document.getElementById('btnSubmitPoint').disabled = !has;
}

function closeAddModal() {
  document.getElementById('addModal').style.display = 'none';
  if (pendingMarker) { map.removeLayer(pendingMarker); pendingMarker = null; }
  pendingGeo = null;
}

// ══════════════════════════════════════════════════
//  SET NODE (sửa đường của 1 điểm có sẵn)
// ══════════════════════════════════════════════════
let setNodeTarget = null;

function findMarkerByPos(pos) {
  let found = null;
  if (layerGroup) layerGroup.eachLayer(l => { if (l._pos === pos) found = l; });
  return found;
}

function openSetNode() {
  const pos = activeInfoPos;
  if (!pos) return;
  setNodeTarget = pos;
  closeAddModal();
  document.getElementById('setNodeInfo').textContent =
    `#${pos.id} — ${Number(pos.y).toFixed(6)} / ${Number(pos.x).toFixed(6)}`;

  // Dropdown đường lân cận ≤1km
  const sel = document.getElementById('setNodeNearbySel');
  const list = getNearbyStreets(pos.y, pos.x, NEARBY_RADIUS_KM);
  document.getElementById('setNodeNearbyCount').textContent = list.length ? `(${list.length})` : '';
  sel.innerHTML = '';
  list.forEach(s => {
    const o = document.createElement('option');
    o.value = s.id; o.textContent = `${s.name} (#${s.id})`;
    sel.appendChild(o);
  });

  // Danh sách đường hiện tại của node
  const listEl = document.getElementById('setNodeStreetsList');
  listEl.innerHTML = '';
  (pos.streets || []).forEach(id => appendStreetRow(listEl, id, updateSetNodeSaveState));
  updateSetNodeSaveState();
  document.getElementById('setNodeModal').style.display = 'block';
}

function setNodeAdd() {
  const sel = document.getElementById('setNodeNearbySel');
  const ids = [...sel.selectedOptions].map(o => parseInt(o.value)).filter(Boolean);
  if (!ids.length) return;
  const listEl = document.getElementById('setNodeStreetsList');
  ids.forEach(id => appendStreetRow(listEl, id, updateSetNodeSaveState));
  sel.selectedIndex = -1;
}

function updateSetNodeSaveState() {
  const n = document.querySelectorAll('#setNodeStreetsList [data-street-id]').length;
  document.getElementById('btnSetNodeSave').disabled = n === 0;
}

function closeSetNode() {
  document.getElementById('setNodeModal').style.display = 'none';
  setNodeTarget = null;
}

async function saveSetNode() {
  const pos = setNodeTarget;
  if (!pos) return;
  const streets = [...document.querySelectorAll('#setNodeStreetsList [data-street-id]')]
    .map(el => parseInt(el.getAttribute('data-street-id'))).filter(Boolean);
  if (!streets.length) { alert('Node cần ít nhất 1 đường.'); return; }
  const btn = document.getElementById('btnSetNodeSave');
  btn.disabled = true;
  try {
    // pos_id có → backend UPDATE streets + đồng bộ Streets.positions
    await apiSend('/positions/bulk', 'POST', [{ lat: pos.y, lon: pos.x, streets, pos_id: pos.id }]);
    pos.streets = streets;
    const names = streets.map(id => streetMap[id] && streetMap[id].name).filter(Boolean).join(', ') || '—';
    const marker = findMarkerByPos(pos);
    if (marker) {
      marker._streetNames = names;
      const el = marker.getElement && marker.getElement();
      if (el) el.setAttribute('title', names);
    }
    closeSetNode();
    if (activeInfoPos === pos && marker) showInfo(pos, names, marker);
    showToast(`Đã lưu node #${pos.id}: ${streets.length} đường`);
  } catch (e) {
    console.error('saveSetNode', e);
    alert('Lưu node thất bại.');
    btn.disabled = false;
  }
}

// ══════════════════════════════════════════════════
//  DROPDOWN LOADERS
// ══════════════════════════════════════════════════
async function loadCities() {
  try {
    const cities = await apiFetch('/cities');
    const sel = document.getElementById('selCity');
    cities.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.name;
      sel.appendChild(o);
    });
  } catch (e) { console.error('loadCities', e); }
}

async function loadDistricts(cityId) {
  const sel = document.getElementById('selDistrict');
  sel.innerHTML = '<option value="">-- Quận/Huyện --</option>';
  document.getElementById('selStreet').innerHTML = '<option value="">-- Đường --</option>';
  if (!cityId) return;
  try {
    const list = await apiFetch(`/districts?city_id=${cityId}`);
    list.forEach(d => {
      const o = document.createElement('option');
      o.value = d.id; o.textContent = d.name;
      sel.appendChild(o);
    });
  } catch (e) { console.error('loadDistricts', e); }
}

async function loadStreets(districtId, cityId) {
  const sel = document.getElementById('selStreet');
  sel.innerHTML = '<option value="">-- Đường --</option>';
  let q = '';
  if (districtId)   q = `?district_id=${districtId}`;
  else if (cityId)  q = `?city_id=${cityId}`;
  if (!q) return;
  try {
    const list = await apiFetch(`/streets${q}`);
    allStreets = list;
    list.forEach(s => {
      streetMap[s.id] = s;
      const o = document.createElement('option');
      o.value = s.id; o.textContent = s.name;
      sel.appendChild(o);
    });
  } catch (e) { console.error('loadStreets', e); }
}

// Ánh xạ city/district/street của 1 điểm lên toolbar (selCity/selDistrict/selStreet)
async function syncToolbarToPos(pos) {
  const sid = (pos.streets || [])[0];
  const street = sid != null ? streetMap[sid] : null;
  if (!street) return;
  const districtId = street.district_id;
  const cityId = street.city_id != null ? street.city_id : (districtMap[districtId] && districtMap[districtId].city);

  const selCity = document.getElementById('selCity');
  const selDistrict = document.getElementById('selDistrict');
  const selStreet = document.getElementById('selStreet');

  if (cityId != null) {
    selCity.value = String(cityId);
    await loadDistricts(cityId);
  }
  if (districtId != null) {
    selDistrict.value = String(districtId);
    await loadStreets(districtId, cityId);
  }
  if (sid != null) selStreet.value = String(sid);
  updatePaths();
}

// ══════════════════════════════════════════════════
//  SEARCH (Nominatim geocoding – miễn phí, OSM)
// ══════════════════════════════════════════════════
function setupSearch() {
  const input  = document.getElementById('searchInput');
  const btn    = document.getElementById('btnSearch');

  async function doSearch() {
    const q = input.value.trim();
    if (!q) return;
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=vn`;
      const res  = await fetch(url, { headers: { 'Accept-Language': 'vi' } });
      const data = await res.json();
      if (data.length === 0) { alert('Không tìm thấy địa điểm: ' + q); return; }
      const { lat, lon } = data[0];
      map.setView([parseFloat(lat), parseFloat(lon)], 15);
    } catch (e) { console.error('search', e); }
  }

  btn.addEventListener('click', doSearch);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
}

// ══════════════════════════════════════════════════
//  UI LISTENERS
// ══════════════════════════════════════════════════
function setupUIListeners() {
  document.getElementById('selCity').addEventListener('change', async e => {
    await loadDistricts(e.target.value);
    updatePaths();
  });

  document.getElementById('selDistrict').addEventListener('change', async e => {
    const cityId = document.getElementById('selCity').value;
    await loadStreets(e.target.value, cityId);
    updatePaths();
  });

  document.getElementById('selStreet').addEventListener('change', () => updatePaths());

  document.getElementById('btnLoad').addEventListener('click', () => {
    const streetId = document.getElementById('selStreet').value;
    const endpoint = streetId ? `/positions?street_id=${streetId}` : '/positions';
    loadPositions(endpoint);
  });

  document.getElementById('btnMove').addEventListener('click', () => setMoveMode(!moveMode));

  document.getElementById('btnAdd').addEventListener('click', () => setAddMode(!addMode));
  document.getElementById('btnCreateDistrict').addEventListener('click', onCreateDistrict);
  document.getElementById('btnCreateStreet').addEventListener('click', onCreateStreet);
  document.getElementById('btnAddNearby').addEventListener('click', addNearbyStreet);
  document.getElementById('btnSubmitPoint').addEventListener('click', onSubmitPoint);
  document.getElementById('btnCancelPoint').addEventListener('click', closeAddModal);
  document.getElementById('btnCancelPointX').addEventListener('click', closeAddModal);
  document.getElementById('addStreetSel').addEventListener('change', updateSubmitState);

  document.getElementById('btnSetNode').addEventListener('click', openSetNode);
  document.getElementById('btnSetNodeAdd').addEventListener('click', setNodeAdd);
  document.getElementById('btnSetNodeSave').addEventListener('click', saveSetNode);
  document.getElementById('btnSetNodeCancel').addEventListener('click', closeSetNode);
  document.getElementById('setNodeCloseX').addEventListener('click', closeSetNode);

  document.getElementById('btnClear').addEventListener('click', () => {
    clearMarkers();
    document.getElementById('selCity').value = '';
    document.getElementById('selDistrict').innerHTML = '<option value="">-- Quận/Huyện --</option>';
    document.getElementById('selStreet').innerHTML   = '<option value="">-- Đường --</option>';
    document.getElementById('searchInput').value = '';
    map.setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);
  });

  document.getElementById('closeInfo').addEventListener('click', hideInfo);

  // Hotkeys: N = Add điểm, M = Move điểm (bỏ qua khi đang gõ trong input/select/textarea)
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const tag = ((e.target && e.target.tagName) || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;
    const k = (e.key || '').toLowerCase();
    if (k === 'n') { e.preventDefault(); setAddMode(!addMode); }
    else if (k === 'm') { e.preventDefault(); setMoveMode(!moveMode); }
  });
}

// ══════════════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════════════
// Nạp toàn bộ Streets + Districts để resolve tên đường/phường cho mọi marker
async function loadAllRefData() {
  try {
    const [streets, districts] = await Promise.all([
      apiFetch('/streets'),
      apiFetch('/districts'),
    ]);
    (streets || []).forEach(s => { streetMap[s.id] = s; });
    allStreets = streets || [];
    (districts || []).forEach(d => { districtMap[d.id] = d; });
  } catch (e) {
    console.error('loadAllRefData', e);
  }
}

(async function boot() {
  initMap();
  setupSearch();
  setupUIListeners();
  await loadCities();
  await loadAllRefData();   // nạp Streets + Districts trước khi render marker

  // Load toàn bộ marker từ DB ngay khi trang mở
  await loadPositions('/positions');

  // Nếu lần trước có chọn marker → center về đó, zoom 15
  try {
    const last = JSON.parse(localStorage.getItem(LAST_MARKER_KEY) || 'null');
    if (last && last.lat != null && last.lng != null) {
      map.setView([last.lat, last.lng], 15);
    }
  } catch (e) {}

  setLoading(false);
})();
</script>
